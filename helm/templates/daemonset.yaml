---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lvminit.fullname" . }}
  labels:
    {{- include "lvminit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "lvminit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/lvminit-config: {{ .Values.config | toYaml | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lvminit.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "lvminit.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: lvminit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - /etc/lvminit/config.yaml
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: lvm-backup
              mountPath: /etc/lvm/backup
              mountPropagation: Bidirectional
            - name: lvm-cache
              mountPath: /etc/lvm/cache
              mountPropagation: Bidirectional
            - name: lvm-archive
              mountPath: /etc/lvm/archive
              mountPropagation: Bidirectional
            - name: lvm-lock
              mountPath: /run/lock/lvm
              mountPropagation: Bidirectional
            - name: lvminit-config
              mountPath: /etc/lvminit/config.yaml
              subPath: config.yaml
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: lvm-backup
          hostPath:
            path: {{ .Values.hostWritePath }}/backup
            type: DirectoryOrCreate
        - name: lvm-cache
          hostPath:
            path: {{ .Values.hostWritePath }}/cache
            type: DirectoryOrCreate
        - name: lvm-archive
          hostPath:
            path: {{ .Values.hostWritePath }}/archive
            type: DirectoryOrCreate
        - name: lvm-lock
          hostPath:
            path: {{ .Values.hostWritePath }}/lock
            type: DirectoryOrCreate
        - name: lvminit-config
          configMap:
            name: {{ include "lvminit.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
